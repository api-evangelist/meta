description: >-
  Structured capture of Meta's Graph API / Marketing API versioning. Meta cuts a
  new numbered version (~every 3-4 months) shared across Graph API and Marketing
  API; each version has ~2 years of support before it is deprecated then sunset.
  Clients pin a version in the URL path (e.g. /v25.0/me). Breaking changes take
  effect only for apps calling the new version; older pinned versions keep old
  behavior until sunset. This artifact records the recent version window; the
  live changelog is the source of truth.
docs: https://developers.facebook.com/docs/graph-api/changelog
