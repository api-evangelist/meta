  notes: >-
    Graph API and Marketing API share aligned numbered versions released roughly
    every 3-4 months. An unversioned call uses the app's default version. Each
    version is supported ~2 years from release, then deprecated and sunset.
deprecation:
  policy_url: https://developers.facebook.com/docs/graph-api/guides/versioning
  changelog: https://developers.facebook.com/docs/graph-api/changelog
  sunset_header: false
  notes: >-
    Deprecation is version-based, not per-endpoint RFC 8594 Sunset headers. When
    a version reaches its expiration date, calls to it are automatically upgraded
    to the next available version, which can introduce breaking changes. Field
    and feature deprecations are announced per version in the changelog (e.g.
    Page recommendations removed in v22.0, returning error code 12).
